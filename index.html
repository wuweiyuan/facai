<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玄学选股池</title>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: rgba(255, 250, 242, 0.9);
      --panel-strong: #fffaf2;
      --ink: #1f2a1f;
      --muted: #5d6759;
      --line: rgba(31, 42, 31, 0.12);
      --accent: #1f5c4a;
      --accent-soft: rgba(31, 92, 74, 0.12);
      --accent-strong: #11382d;
      --danger: #8a3b2e;
      --shadow: 0 24px 60px rgba(38, 39, 34, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(31, 92, 74, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(138, 59, 46, 0.12), transparent 28%),
        linear-gradient(180deg, #f8f3ea 0%, var(--bg) 52%, #efe6d8 100%);
      min-height: 100vh;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 32px auto 48px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .panel {
      padding: 22px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .section-title small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .control-row,
    .summary-grid {
      display: grid;
      gap: 12px;
    }

    .control-row {
      grid-template-columns: minmax(0, 1fr);
      margin-bottom: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
    }

    select,
    input[type="file"],
    button {
      border-radius: 14px;
      border: 1px solid rgba(31, 42, 31, 0.14);
      font: inherit;
    }

    select,
    input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--panel-strong);
      color: var(--ink);
    }

    .summary-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 18px;
    }

    .metric {
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(248, 243, 234, 0.98));
      border: 1px solid rgba(31, 42, 31, 0.08);
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
    }

    .metric .value {
      margin-top: 8px;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 700;
      font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .hint code {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(31, 92, 74, 0.08);
    }

    .status {
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(31, 92, 74, 0.08);
      border: 1px solid rgba(31, 92, 74, 0.10);
      color: var(--accent-strong);
      line-height: 1.6;
      font-size: 14px;
    }

    .status.warn {
      background: rgba(138, 59, 46, 0.08);
      border-color: rgba(138, 59, 46, 0.12);
      color: var(--danger);
    }

    .playbook {
      margin-top: 16px;
      padding: 18px 20px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(248, 243, 234, 0.98));
      border: 1px solid rgba(31, 42, 31, 0.08);
    }

    .playbook.highlight {
      border-color: rgba(31, 92, 74, 0.28);
      box-shadow: 0 0 0 3px rgba(31, 92, 74, 0.08);
    }

    .playbook h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .playbook p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .playbook ul {
      margin: 0;
      padding-left: 18px;
      color: var(--ink);
      line-height: 1.8;
      font-size: 14px;
    }

    .playbook li + li {
      margin-top: 4px;
    }

    .table-wrap {
      overflow: auto;
      border-radius: 18px;
      border: 1px solid rgba(31, 42, 31, 0.08);
      background: rgba(255, 255, 255, 0.74);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    th,
    td {
      padding: 14px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(31, 42, 31, 0.08);
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      position: sticky;
      top: 0;
      background: rgba(244, 239, 230, 0.95);
      color: var(--muted);
      font-weight: 600;
      text-align: center;
      z-index: 1;
    }

    tbody tr:hover {
      background: rgba(31, 92, 74, 0.05);
    }

    .stock-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      align-items: center;
      text-align: center;
    }

    .stock-code {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    th.stock-col,
    td.stock-col {
      min-width: 72px;
      width: 72px;
      max-width: 72px;
      padding-left: 8px;
      padding-right: 8px;
    }

    .stock-cell strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.2;
    }

    .badge {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    th.strategy-col,
    td.strategy-col {
      width: 88px;
      min-width: 88px;
      max-width: 88px;
      padding-left: 8px;
      padding-right: 8px;
    }

    .empty {
      padding: 44px 18px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 980px) {
      .shell {
        width: calc(100vw - 20px);
        margin: 10px auto 22px;
      }

      .panel {
        padding: 16px;
        border-radius: 18px;
      }

      .summary-grid,
      .control-row {
        grid-template-columns: 1fr;
      }

      th,
      td {
        padding: 12px 12px;
        font-size: 13px;
      }

      th.stock-col,
      td.stock-col {
        min-width: 76px;
        width: 76px;
        max-width: 76px;
        padding-left: 6px;
        padding-right: 6px;
      }

      th.strategy-col,
      td.strategy-col {
        width: 96px;
        min-width: 96px;
        max-width: 96px;
        padding-left: 6px;
        padding-right: 6px;
      }

      .table-wrap {
        -webkit-overflow-scrolling: touch;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
        <div class="section-title">
          <div>
            <h2>玄学选股池</h2>
            <p>自适应策略、日期筛选、当日推荐列表</p>
            <small>只展示最近 20 个交易日</small>
          </div>
        </div>

        <div class="control-row">
          <div class="field">
            <label for="dateSelect">交易日</label>
            <select id="dateSelect"></select>
          </div>
        </div>

        <div class="summary-grid">
          <div class="metric">
            <div class="label">当前策略</div>
            <div class="value" id="metricStrategy">默认战法</div>
          </div>
          <div class="metric">
            <div class="label">当日股票数</div>
            <div class="value" id="metricCount">0</div>
          </div>
          <div class="metric">
            <div class="label">最新运行时间</div>
            <div class="value" id="metricRunTime">-</div>
          </div>
        </div>

        <div class="status" id="dataStatus"></div>

        <div class="playbook" id="strategyPlaybook">
          <h3 id="playbookTitle">默认战法说明</h3>
          <div id="playbookBody"></div>
        </div>

        <div class="table-wrap" style="margin-top: 16px;">
          <table>
            <thead>
              <tr>
                <th class="stock-col">股票</th>
                <th class="strategy-col">策略</th>
                <th>模式</th>
                <th>总分</th>
                <th>收盘价</th>
                <th>止损价</th>
                <th>止盈价</th>
                <th>建议持有天数</th>
                <th>运行时间</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="empty" id="emptyState" hidden>当前策略在所选日期下没有记录。</div>
        </div>

        <div class="playbook" style="margin-top: 18px;">
          <div id="opportunityPanel">
          <h3>机会池</h3>
          <p>当正式信号较少或空仓时，这里展示更宽一点的备选名单，只供人工复核，不等于正式交易信号。</p>
          <div class="status warn" style="margin-top: 10px;">机会池股票仅作观察参考，谨慎操作，不建议直接按列表机械买入。</div>
          <div class="table-wrap" style="margin-top: 12px;">
            <table>
              <thead>
                <tr>
                  <th class="stock-col">股票</th>
                  <th class="strategy-col">来源</th>
                  <th>总分</th>
                  <th>收盘价</th>
                  <th>建议持有天数</th>
                  <th>退出规则</th>
                </tr>
              </thead>
              <tbody id="opportunityBody"></tbody>
            </table>
            <div class="empty" id="opportunityEmpty" hidden>当前日期没有机会池记录。</div>
          </div>
          </div>
        </div>
    </section>
  </div>

  <script src="reports/dashboard-data.js"></script>
  <script>
    (function () { 
      const MAX_VISIBLE_DATES = 20;
      const STRATEGY_META = {
        adaptive: {
          label: "自适应策略",
          playbookTitle: "自适应策略说明",
          playbookHtml: [
            "<p>这页只显示 <code>recommend-adaptive</code> 的结果。系统会先判断市场状态，再决定优先尝试哪套策略；如果没有合适信号，就建议空仓。你可以把它理解成“先决定今天该打哪种仗，再决定买哪只票”。</p>",
            "<ul>",
            "<li><strong>牛市 / 震荡市：</strong>优先尝试 <code>recommend-pullback</code>，再看 <code>recommend</code>。思路是先做位置更克制、回踩确认的票，再考虑强趋势延续票。</li>",
            "<li><strong>熊市：</strong>优先只尝试 <code>recommend-oversold</code>。思路是弱市更少追趋势，多做超跌修复。</li>",
            "<li><strong>空仓原则：</strong>如果对应策略没有候选，就直接空仓，而不是为了出手硬选股票。</li>",
            "<li><strong>看盘方式：</strong>先看页面告诉你当天采用哪套策略，再按下方对应规则执行，不需要自己临时切换思路。</li>",
            "<li><strong>数据范围：</strong>页面仍然只保留最近 20 个交易日的数据。</li>",
            "</ul>"
          ].join("")
        }
      };
      const SOURCE_RULES = {
        recommend: {
          label: "默认战法",
          title: "默认战法交易规则",
          html: [
            "<p>默认战法更偏趋势延续，核心是在已经走强的股票里找“还可以继续”的票。它不是低吸策略，也不是抄底策略，更适合强势环境下做右侧确认。</p>",
            "<ul>",
            "<li><strong>适用环境：</strong>更适合牛市或明显偏强的震荡市，不适合普跌和情绪退潮期。</li>",
            "<li><strong>买入前提：</strong>优先看分数靠前、趋势结构完整、量能不弱的票。最好等开盘后 15 到 30 分钟，确认个股强于大盘、强于板块再考虑介入。</li>",
            "<li><strong>不买情况：</strong>高开过多、开盘就冲高回落、量能明显跟不上、或者跌回关键均线附近但承接很弱时，不买。</li>",
            "<li><strong>仓位：</strong>更适合少量试仓，不要把多个同题材趋势票一起打满。</li>",
            "<li><strong>持有：</strong>更偏 3 到 5 个交易日。第 1 到第 2 天如果完全不强，后面继续走趋势的概率会明显下降。</li>",
            "<li><strong>止损：</strong>买入后跌破关键均线、或者单笔亏损达到 4% 到 5% 时，优先止损。</li>",
            "<li><strong>止盈：</strong>出现放量冲高回落、加速后次日不再走强、或短期涨幅已经明显兑现时，可以分批减仓，不必硬等。</li>",
            "</ul>"
          ].join("")
        },
        "recommend-pullback": {
          label: "回头战法",
          title: "回头战法交易规则",
          html: [
            "<p>回头战法做的是上升结构里的回踩确认，不追高，重点看回踩后的承接是否成立。它不是赌反抽，而是赌“原本就强的票，回踩后恢复趋势”。</p>",
            "<ul>",
            "<li><strong>适用环境：</strong>最适合当前这套系统里的主策略，尤其适合震荡市和偏强市。</li>",
            "<li><strong>买入前提：</strong>个股原本就在上升结构中，只是短期回踩。最好等它止跌后重新站回均线附近，或者至少确认不再继续走弱再买。</li>",
            "<li><strong>不买情况：</strong>回踩过深、直接跌破中期结构、开盘就大幅拉高、或者均线附近反复无承接时，不买。</li>",
            "<li><strong>仓位：</strong>适合做主策略，优先前 1 到 2 只，仓位可以比超跌反弹更积极一点，但仍不建议满仓同方向。</li>",
            "<li><strong>持有：</strong>默认更适合 3 到 5 个交易日。它赚的是“回踩确认后的再走一段”，不是当天超短线脉冲。</li>",
            "<li><strong>止损：</strong>回踩确认失败、重新跌破关键均线、或者买后 2 到 3 天完全不走强，就直接退出。</li>",
            "<li><strong>止盈：</strong>如果恢复趋势后很快冲出一段，可分批减仓；如果回到压力位附近明显滞涨，也应优先兑现。</li>",
            "</ul>"
          ].join("")
        },
        "recommend-oversold": {
          label: "超跌反弹",
          title: "超跌反弹交易规则",
          html: [
            "<p>超跌反弹做的是情绪过度后的短线修复，不是趋势主升浪。核心是等次日止跌回稳，而不是看到暴跌就直接接飞刀。它更像战术性交易，不适合当成长持逻辑。</p>",
            "<ul>",
            "<li><strong>适用环境：</strong>主要用于熊市或弱市，特别是情绪砸得很厉害、但短线容易技术修复的时候。</li>",
            "<li><strong>买入前提：</strong>只看前一交易日筛出来的票。次日高开超过 3% 不追；先等 15 到 30 分钟；不再创新低且重新回到开盘价附近，再考虑介入。</li>",
            "<li><strong>不买情况：</strong>开盘继续杀跌、不断创新低、低开后没有承接、或者已经高开把反弹空间吃掉时，不买。</li>",
            "<li><strong>仓位：</strong>适合少选精做，优先前 1 到 2 只，不适合摊很多票。</li>",
            "<li><strong>持有：</strong>更偏 2 到 3 个交易日。它赚的是“快速修复的钱”，不是长期趋势的钱。</li>",
            "<li><strong>止损：</strong>亏损到 5% 到 6% 直接止损；如果买入后第 2 天到第 3 天仍然没有明显修复，也应该退出。</li>",
            "<li><strong>止盈：</strong>快速反弹到 5% 到 8% 可提前止盈；如果反弹后明显转弱，也不要贪。</li>",
            "</ul>"
          ].join("")
        }
      };

      const builtinData = window.STOCK_DASHBOARD_DATA || null;
      const state = {
        data: builtinData,
        strategy: "adaptive",
        selectedDate: ""
      };

      const dateSelect = document.getElementById("dateSelect");
      const dataStatus = document.getElementById("dataStatus");
      const tableBody = document.getElementById("tableBody");
      const emptyState = document.getElementById("emptyState");
      const opportunityBody = document.getElementById("opportunityBody");
      const opportunityEmpty = document.getElementById("opportunityEmpty");
      const opportunityPanel = document.getElementById("opportunityPanel");
      const metricStrategy = document.getElementById("metricStrategy");
      const metricCount = document.getElementById("metricCount");
      const metricRunTime = document.getElementById("metricRunTime");
      const playbookTitle = document.getElementById("playbookTitle");
      const playbookBody = document.getElementById("playbookBody");

      render();

      function bindEvents() {
        dateSelect.addEventListener("change", function () {
          state.selectedDate = dateSelect.value;
          render();
        });
      }
      bindEvents();

      function render() {
        const data = state.data;

        if (!data) {
          dateSelect.innerHTML = "";
          metricStrategy.textContent = STRATEGY_META[state.strategy].label;
          playbookTitle.textContent = STRATEGY_META[state.strategy].playbookTitle;
          playbookBody.innerHTML = STRATEGY_META[state.strategy].playbookHtml;
          metricCount.textContent = "0";
          metricRunTime.textContent = "-";
          setStatus("未检测到预生成数据文件。请先运行 `python -m app.main export-dashboard-data`。", true);
          renderTable([]);
          return;
        }

        ensureSelectedDate();
        populateDateOptions();

        const strategyData = getStrategyData(state.strategy);
        const records = getVisibleRecords();
        const opportunityRecords = getOpportunityRecords();
        const dateSummary = getDateSummary(strategyData, state.selectedDate);
        const latestRunTime = records.length ? records[0].run_time || "-" : (strategyData.latest_run_time || "-");
        const selectedSource = resolveSelectedSourceStrategy(records, dateSummary);

        metricStrategy.textContent = strategyData.label;
        applyPlaybook(selectedSource);
        metricCount.textContent = String(records.length);
        metricRunTime.textContent = latestRunTime;
        setStatus(buildStatusText(selectedSource, dateSummary, records), !records.length);

        renderTable(records);
        renderOpportunityTable(opportunityRecords);
        opportunityPanel.classList.toggle("highlight", !records.length && opportunityRecords.length > 0);
      }

      function resolveSelectedSourceStrategy(records, dateSummary) {
        if (!records.length) {
          return dateSummary && typeof dateSummary.chosen_strategy === "string" ? dateSummary.chosen_strategy : "";
        }
        const source = records[0].source_strategy || "";
        return typeof source === "string" ? source : "";
      }

      function applyPlaybook(sourceStrategy) {
        if (sourceStrategy && SOURCE_RULES[sourceStrategy]) {
          playbookTitle.textContent = SOURCE_RULES[sourceStrategy].title;
          playbookBody.innerHTML = SOURCE_RULES[sourceStrategy].html;
          return;
        }
        playbookTitle.textContent = STRATEGY_META[state.strategy].playbookTitle;
        playbookBody.innerHTML = STRATEGY_META[state.strategy].playbookHtml;
      }

      function buildStatusText(sourceStrategy, dateSummary, records) {
        if (!sourceStrategy || !SOURCE_RULES[sourceStrategy]) {
          if (dateSummary && dateSummary.market_state) {
            return "本日无候选，建议空仓；市场状态: " + dateSummary.market_state;
          }
          return "本日无候选，建议空仓";
        }
        const firstRecord = records && records.length ? records[0] : null;
        const rawExitPlan = firstRecord && firstRecord.exit_plan ? String(firstRecord.exit_plan).trim() : "";
        const exitPlan = rawExitPlan ? "；" + rawExitPlan : "";
        const shouldShowHoldDays = !rawExitPlan;
        const holdDays = firstRecord && shouldShowHoldDays && typeof firstRecord.suggested_holding_days === "number"
          ? "；默认持有: " + firstRecord.suggested_holding_days + "天"
          : "";
        return "本日实际采用策略: " + SOURCE_RULES[sourceStrategy].label + holdDays + exitPlan;
      }

      function ensureSelectedDate() {
        const strategyData = getStrategyData(state.strategy);
        const dates = getVisibleDates(strategyData);
        if (!dates.length) {
          state.selectedDate = "";
          return;
        }
        if (!dates.includes(state.selectedDate)) {
          state.selectedDate = dates[0];
        }
      }

      function populateDateOptions() {
        const strategyData = getStrategyData(state.strategy);
        const dates = getVisibleDates(strategyData);
        dateSelect.innerHTML = "";

        if (!dates.length) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "无可选日期";
          dateSelect.appendChild(option);
          return;
        }

        dates.forEach(function (dateValue) {
          const option = document.createElement("option");
          option.value = dateValue;
          option.textContent = dateValue;
          option.selected = dateValue === state.selectedDate;
          dateSelect.appendChild(option);
        });
      }

      function getStrategyData(strategyKey) {
        if (state.data && state.data.strategies && state.data.strategies[strategyKey]) {
          return state.data.strategies[strategyKey];
        }
        const meta = STRATEGY_META[strategyKey] || null;
        return {
          key: strategyKey,
          label: meta ? meta.label : strategyKey,
          source_file: "",
          available_dates: [],
          latest_run_time: null,
          records: [],
          date_summaries: {}
        };
      }

      function getDateSummary(strategyData, targetDate) {
        if (!strategyData || !strategyData.date_summaries || !targetDate) {
          return null;
        }
        return strategyData.date_summaries[targetDate] || null;
      }

      function getVisibleRecords() {
        const strategyData = getStrategyData(state.strategy);
        const targetDate = state.selectedDate;
        const visibleDates = getVisibleDates(strategyData);
        if (!targetDate) {
          return [];
        }
        if (!visibleDates.includes(targetDate)) {
          return [];
        }
        return (strategyData.records || []).filter(function (record) {
          return record.trade_date === targetDate;
        });
      }

      function getOpportunityRecords() {
        const strategyData = getStrategyData("opportunity");
        const targetDate = state.selectedDate;
        if (!targetDate) {
          return [];
        }
        return (strategyData.records || []).filter(function (record) {
          return record.trade_date === targetDate;
        });
      }

      function getVisibleDates(strategyData) {
        return (strategyData.available_dates || []).slice(0, MAX_VISIBLE_DATES);
      }

      function renderTable(records) {
        tableBody.innerHTML = "";

        if (!records.length) {
          emptyState.hidden = false;
          return;
        }

        emptyState.hidden = true;
        records.forEach(function (record) {
          const sourceStrategy = normalizeSourceStrategy(record.source_strategy);
          const tr = document.createElement("tr");
          tr.innerHTML = [
            "<td class=\"stock-col\"><div class=\"stock-cell\"><strong>" + escapeHtml(record.name || "-") + "</strong><span class=\"stock-code\">" + escapeHtml(record.symbol || "-") + "</span></div></td>",
            "<td class=\"strategy-col\"><span class=\"badge\">" + escapeHtml(sourceStrategy.label) + "</span></td>",
            "<td><span class=\"badge\">" + escapeHtml(record.threshold_mode || "-") + "</span></td>",
            "<td>" + formatNumber(record.score_total, 2) + "</td>",
            "<td>" + formatNumber(record.close, 4) + "</td>",
            "<td>" + formatNumber(record.stop_loss_price, 4) + "</td>",
            "<td>" + formatNumber(record.take_profit_price, 4) + "</td>",
            "<td>" + formatInteger(record.suggested_holding_days) + "</td>",
            "<td>" + escapeHtml(record.run_time || "-") + "</td>"
          ].join("");
          tableBody.appendChild(tr);
        });
      }

      function renderOpportunityTable(records) {
        opportunityBody.innerHTML = "";
        if (!records.length) {
          opportunityEmpty.hidden = false;
          return;
        }
        opportunityEmpty.hidden = true;
        records.forEach(function (record) {
          const sourceStrategy = normalizeSourceStrategy(record.source_strategy);
          const tr = document.createElement("tr");
          tr.innerHTML = [
            "<td class=\"stock-col\"><div class=\"stock-cell\"><strong>" + escapeHtml(record.name || "-") + "</strong><span class=\"stock-code\">" + escapeHtml(record.symbol || "-") + "</span></div></td>",
            "<td class=\"strategy-col\"><span class=\"badge\">" + escapeHtml(sourceStrategy.label) + "</span></td>",
            "<td>" + formatNumber(record.score_total, 2) + "</td>",
            "<td>" + formatNumber(record.close, 4) + "</td>",
            "<td>" + formatInteger(record.suggested_holding_days) + "</td>",
            "<td>" + escapeHtml(record.exit_plan || "-") + "</td>",
          ].join("");
          opportunityBody.appendChild(tr);
        });
      }

      function setStatus(text, isWarn) {
        dataStatus.textContent = text;
        dataStatus.classList.toggle("warn", Boolean(isWarn));
      }

      function normalizeSourceStrategy(sourceStrategy) {
        if (sourceStrategy && SOURCE_RULES[sourceStrategy]) {
          return SOURCE_RULES[sourceStrategy];
        }
        return { label: "-" };
      }

      function formatNumber(value, digits) {
        if (typeof value !== "number" || !Number.isFinite(value)) {
          return "-";
        }
        return value.toFixed(digits);
      }

      function formatInteger(value) {
        if (typeof value !== "number" || !Number.isFinite(value)) {
          return "-";
        }
        return String(value);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
    })();
  </script>
</body>
</html>
